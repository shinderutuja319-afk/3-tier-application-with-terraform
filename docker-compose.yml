
services:

  frontend:
    build: ./frontend
    container_name: cloudtask-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - web-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: cloudtask-backend
    environment:
      DB_HOST: db
      DB_NAME: cloudtask
      DB_USER: clouduser
      DB_PASSWORD: ${DB_PASSWORD:-localdevpassword}
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-network
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cloudtask-database
    environment:
      POSTGRES_DB: cloudtask
      POSTGRES_USER: clouduser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localdevpassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clouduser -d cloudtask"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  web-network:
  app-network:
    internal: true
